name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  linux-quality:
    name: Linux quality checks
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          cache-dependency-path: go.mod

      - name: Check gofmt
        shell: bash
        run: |
          files="$(gofmt -l .)"
          if [[ -n "$files" ]]; then
            printf '%s\n' "$files"
            exit 1
          fi

      - name: Test
        run: go test -count=1 ./...

      - name: Vet
        run: go vet ./...

      - name: Race tests
        run: go test -race -count=1 ./...

  windows-build:
    name: Windows amd64 CGO-disabled build
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          cache-dependency-path: go.mod

      - name: Vet Windows-tagged sources
        shell: pwsh
        run: |
          $env:CGO_ENABLED = '0'
          $env:GOOS = 'windows'
          $env:GOARCH = 'amd64'
          go vet ./...

      - name: Build and check version
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $env:CGO_ENABLED = '0'
          $env:GOOS = 'windows'
          $env:GOARCH = 'amd64'
          go build -trimpath -ldflags='-s -w' -o dist/PreRecs.exe .
          $source = Get-Content main.go -Raw
          $versionMatch = [regex]::Match($source, 'const version = "(?<version>[^"\r\n]+)"')
          if (-not $versionMatch.Success) {
            throw 'Could not find the source application version'
          }
          $version = $versionMatch.Groups['version'].Value
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Invalid source application version: $version"
          }
          $expected = "PreRecs $version"
          $reported = (& dist/PreRecs.exe --version).Trim()
          if ($reported -ne $expected) {
            throw "Unexpected version: $reported"
          }
