name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  windows-release:
    name: Windows amd64 release
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          cache-dependency-path: go.mod

      # The release tag must not publish a build the CI gate would reject —
      # run the same checks here before packaging. Native commands do not trip
      # pwsh's error action, so each gate checks its exit code explicitly.
      - name: Release gate (gofmt, vet, tests)
        shell: pwsh
        run: |
          $fmt = gofmt -l .
          if ($fmt) { throw "gofmt: unformatted files:`n$fmt" }
          if ($LASTEXITCODE -ne 0) { throw "gofmt failed (exit $LASTEXITCODE)" }
          go vet ./...
          if ($LASTEXITCODE -ne 0) { throw "go vet failed (exit $LASTEXITCODE)" }
          go test -count=1 ./...
          if ($LASTEXITCODE -ne 0) { throw "go test failed (exit $LASTEXITCODE)" }

      - name: Build, package, and checksum
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist, dist/package | Out-Null
          $env:CGO_ENABLED = '0'
          $env:GOOS = 'windows'
          $env:GOARCH = 'amd64'
          go build -trimpath -ldflags='-s -w' -o dist/PreRecs.exe .

          $tag = $env:GITHUB_REF_NAME
          if ($tag -notmatch '^v(?<version>\d+\.\d+\.\d+)$') {
            throw "Release tag must use vMAJOR.MINOR.PATCH, got: $tag"
          }
          $version = $Matches.version
          $expectedVersion = "PreRecs $version"
          $reported = (& dist/PreRecs.exe --version).Trim()
          if ($reported -ne $expectedVersion) {
            throw "Expected $expectedVersion, got: $reported"
          }

          Copy-Item dist/PreRecs.exe dist/package/PreRecs.exe
          Copy-Item README.md, LICENSE, CHANGELOG.md, LICENSING.md, RESEARCH_NOTES.md, TESTED.md dist/package/
          $artifact = "PreRecs-$tag-windows-amd64.zip"
          Compress-Archive -Path dist/package/* -DestinationPath "dist/$artifact"
          $zipHash = (Get-FileHash "dist/$artifact" -Algorithm SHA256).Hash.ToLowerInvariant()
          $exeHash = (Get-FileHash dist/PreRecs.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          @(
            "$zipHash  $artifact"
            "$exeHash  PreRecs.exe"
          ) | Set-Content -Encoding ascii dist/SHA256SUMS.txt

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $artifact = "dist/PreRecs-$tag-windows-amd64.zip"
          gh release create $tag $artifact dist/PreRecs.exe dist/SHA256SUMS.txt --repo "$env:GITHUB_REPOSITORY" --title "PreRecs $tag" --generate-notes
